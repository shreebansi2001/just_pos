name: Deploy to Live POS

on:
  push:
    branches:
      - feature/setup
      - main
    paths:
      - 'web/pos-preview/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Upload to FTP
        run: |
          python3 -c "
          import ftplib
          import os

          cred_combos = [
              ('justcatering', 'Just@123_4'),
              ('justcatering@justcatering.in', 'Just@123_4'),
              ('justcatering@pos.justcatering.in', 'Just@123_4')
          ]

          ftp = None
          for user, pwd in cred_combos:
              try:
                  print(f'Attempting login as {user}...')
                  test_ftp = ftplib.FTP()
                  test_ftp.connect('pos.justcatering.in', 21, timeout=30)
                  test_ftp.login(user, pwd)
                  test_ftp.set_pasv(True)
                  print(f'Successfully authenticated as {user}!')
                  ftp = test_ftp
                  break
              except Exception as e:
                  print(f'Auth failed for {user}: {e}')

          if not ftp:
              raise SystemExit('All authentication combinations failed.')

          file_path = 'web/pos-preview/index.html'
          targets = [
              '/public_html/index.html',
              '/public_html/pos/index.html',
              '/public_html/pos.justcatering.in/index.html'
          ]
          for target in targets:
              try:
                  with open(file_path, 'rb') as f:
                      ftp.storbinary(f'STOR {target}', f)
                      print('Successfully deployed to:', target)
              except Exception as e:
                  print('Upload error for', target, ':', e)
          ftp.quit()
          print('Deployment finished successfully!')
          "
